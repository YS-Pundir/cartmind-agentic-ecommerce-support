services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    volumes:
      # runtime state: checkpoints, chroma DB, conversations, order DB, logs
      - ./storage:/app/storage
      - ./data:/app/data
      - ./logs:/app/logs
    expose:
      - "8000"          # internal only; nginx proxies to it
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
